name: Release AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev meson ninja-build pkg-config wget

      - name: Install Python packaging dependencies
        run: python3 -m pip install --upgrade PySide6 PyInstaller

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LINUXDEPLOY: ${{ github.workspace }}/linuxdeploy-x86_64.AppImage
        run: bash packaging/appimage/build-appimage.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViiZeyMix-AppImage
          path: dist-appimage/*

      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist-appimage/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist-appimage/* --generate-notes
          fi
